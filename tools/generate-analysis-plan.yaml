name: generate-analysis-plan
description: Generate a pre-specified analysis plan based on outcome type and covariates.
version: 1.0.0
input_schema:
  type: object
  properties:
    primary_outcome: {type: string}
    outcome_type: {type: string, enum: [continuous, binary, count, time-to-event]}
    covariates:
      type: array
      items: {type: string}
  required: [primary_outcome, outcome_type]
output_schema:
  type: object
implementation:
  type: script
  path: generate_analysis_plan.py
  runtime: python3
